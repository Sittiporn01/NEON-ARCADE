<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Plant Guardians - Ultimate Tower Defense</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #090c10;
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 255, 204, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1f293d;
            background: #0d1117;
        }
        canvas {
            display: block;
            cursor: default;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }
        .resource-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .resource-icon {
            width: 28px;
            height: 28px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ffcc;
        }
        .stats-box {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: 600;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* แก้ไขตำแหน่ง Deck Bar ไปไว้ฝั่งซ้ายแนวตั้ง */
        .deck-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: absolute;
            left: 16px;
            top: 80px;
            pointer-events: auto;
            z-index: 10;
        }
        .card {
            width: 95px;
            height: 72px;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover:not(.disabled) {
            transform: translateX(6px);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        .card.active {
            border-color: #00ffcc;
            background: #1f293d;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }
        .card-cost {
            font-size: 12px;
            font-weight: bold;
            color: #00ffcc;
        }
        .card-name {
            font-size: 11px;
            text-align: center;
            font-weight: 600;
            line-height: 1.2;
        }
        .card-cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            transition: height 0.1s linear;
        }
        .btn-ult {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-ult:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }
        .btn-ult:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1080" height="640"></canvas>
    
    <div id="ui-layer">
        <div class="top-bar">
            <div class="resource-box">
                <div class="resource-icon"></div>
                <span id="energy-txt">150</span>
            </div>
            <div class="stats-box">
                <div class="stat-item">WAVE: <span id="wave-txt" style="color: #ffaa00;">1</span></div>
                <div class="stat-item">HP: <span id="hp-txt" style="color: #ff3366;">100</span></div>
                <div class="stat-item">SCORE: <span id="score-txt" style="color: #00ffcc;">0</span></div>
            </div>
            <button id="btn-ult" class="btn-ult" disabled>ORBITAL LASER (READY)</button>
        </div>

        <div class="deck-bar" id="deck">
            <!-- Cards dynamic render -->
        </div>
    </div>
</div>

<script>
// ============================================================================
// GAME INITIALIZATION & ENGINE CORE
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_ROWS = 5;
const GRID_COLS = 9;
const CELL_SIZE = 96;
const OFFSET_X = 140; // ปรับตำแหน่ง Offset X ให้หลบแถบ Deck Bar ด้านซ้าย
const OFFSET_Y = 100;

const GAME_STATE = {
    energy: 175,
    hp: 100,
    wave: 1,
    score: 0,
    selectedCard: null,
    ultCooldown: 0,
    maxUltCooldown: 30,
    shakeTime: 0
};

// Global Arrays
let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];
let energyCores = [];
let floatingTexts = [];

// Game Loops Control
let lastTime = performance.now();
let spawnTimer = 0;
let energySpawnTimer = 0;

const TOWER_TYPES = {
    SPROUT: {
        id: 'SPROUT',
        name: 'Laser Sprout',
        cost: 100,
        cooldown: 5,
        hp: 300,
        range: 950,
        fireRate: 1.2,
        damage: 25,
        color: '#00ffcc',
        desc: 'ยูนิตยิงเลเซอร์พื้นฐาน'
    },
    PRODUCER: {
        id: 'PRODUCER',
        name: 'Energy Core',
        cost: 50,
        cooldown: 8,
        hp: 250,
        range: 0,
        fireRate: 7,
        damage: 0,
        color: '#ffcc00',
        desc: 'สร้าง Energy Core เพิ่มพลังงาน'
    },
    FROST: {
        id: 'FROST',
        name: 'Cryo-Fern',
        cost: 175,
        cooldown: 10,
        hp: 350,
        range: 400,
        fireRate: 2.0,
        damage: 15,
        slowFactor: 0.5,
        color: '#00bfff',
        desc: 'แช่แข็งศัตรูให้ช้าลง'
    },
    PLASMA: {
        id: 'PLASMA',
        name: 'Plasma Cannon',
        cost: 225,
        cooldown: 12,
        hp: 400,
        range: 950,
        fireRate: 2.8,
        damage: 80,
        splashRadius: 80,
        color: '#ff0055',
        desc: 'ยิงพลาสม่าระเบิดกระจาย'
    },
    WALL: {
        id: 'WALL',
        name: 'Shield Oak',
        cost: 75,
        cooldown: 15,
        hp: 1200,
        range: 0,
        fireRate: 0,
        damage: 0,
        color: '#2ecc71',
        desc: 'เกราะป้องกันถึกทน'
    }
};

class Tower {
    constructor(row, col, type) {
        this.row = row;
        this.col = col;
        this.x = OFFSET_X + col * CELL_SIZE + CELL_SIZE / 2;
        this.y = OFFSET_Y + row * CELL_SIZE + CELL_SIZE / 2;
        this.type = type;
        this.hp = type.hp;
        this.maxHp = type.hp;
        this.lastShot = 0;
        this.pulse = 0;
    }

    update(now) {
        this.pulse += 0.05;

        if (this.type.id === 'PRODUCER') {
            if (now - this.lastShot > this.type.fireRate * 1000) {
                this.lastShot = now;
                energyCores.push(new EnergyCore(this.x, this.y - 20, 25));
                createParticles(this.x, this.y, '#ffcc00', 8);
            }
            return;
        }

        if (this.type.fireRate > 0) {
            const hasEnemyInRow = enemies.some(e => e.row === this.row && e.x > this.x && e.x < this.x + this.type.range);
            if (hasEnemyInRow && now - this.lastShot > this.type.fireRate * 1000) {
                this.lastShot = now;
                projectiles.push(new Projectile(this.x + 20, this.y, this.row, this.type));
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const glowRadius = 22 + Math.sin(this.pulse) * 3;
        const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowRadius);
        grad.addColorStop(0, this.type.color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#161b22';
        ctx.strokeStyle = this.type.color;
        ctx.lineWidth = 3;
        
        if (this.type.id === 'WALL') {
            ctx.beginPath();
            ctx.roundRect(-22, -26, 44, 52, 8);
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        ctx.fillStyle = this.type.color;
        ctx.beginPath();
        ctx.arc(0, 0, 7 + Math.sin(this.pulse) * 2, 0, Math.PI * 2);
        ctx.fill();

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(255,0,0,0.6)';
            ctx.fillRect(-22, -35, 44, 5);
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(-22, -35, (this.hp / this.maxHp) * 44, 5);
        }

        ctx.restore();
    }
}

class Enemy {
    constructor(row, typeKey) {
        this.row = row;
        this.x = canvas.width + 30;
        this.y = OFFSET_Y + row * CELL_SIZE + CELL_SIZE / 2;
        
        const configs = {
            DRONE: { hp: 120, speed: 1.6, damage: 15, color: '#ff0055', score: 50, radius: 16 },
            WALKER: { hp: 250, speed: 1.0, damage: 25, color: '#ff5500', score: 100, radius: 20 },
            ARMORED: { hp: 600, speed: 0.6, damage: 45, color: '#aa00ff', score: 200, radius: 24 },
            BOSS: { hp: 2000, speed: 0.4, damage: 100, color: '#ff0000', score: 1000, radius: 32 }
        };

        const config = configs[typeKey] || configs.WALKER;
        this.typeKey = typeKey;
        this.hp = config.hp + (GAME_STATE.wave - 1) * 35;
        this.maxHp = this.hp;
        this.speed = config.speed;
        this.currentSpeed = config.speed;
        this.damage = config.damage;
        this.color = config.color;
        this.score = config.score;
        this.radius = config.radius;
        
        this.isFrozen = false;
        this.freezeTimer = 0;
        this.isEating = false;
    }

    update(dt) {
        if (this.isFrozen) {
            this.freezeTimer -= dt;
            if (this.freezeTimer <= 0) {
                this.isFrozen = false;
                this.currentSpeed = this.speed;
            }
        }

        this.isEating = false;
        const targetTower = towers.find(t => t.row === this.row && Math.abs(t.x - this.x) < 35);

        if (targetTower) {
            this.isEating = true;
            targetTower.hp -= this.damage * dt;
            if (targetTower.hp <= 0) {
                towers = towers.filter(t => t !== targetTower);
                createExplosion(targetTower.x, targetTower.y, '#ff3300', 25);
            }
        } else {
            this.x -= this.currentSpeed * 60 * dt;
        }

        if (this.x < OFFSET_X - 20) {
            GAME_STATE.hp -= 15;
            GAME_STATE.shakeTime = 0.3;
            this.hp = 0;
            createExplosion(this.x, this.y, '#ff0000', 30);
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isFrozen) {
            ctx.shadowColor = '#00bfff';
            ctx.shadowBlur = 15;
        }

        ctx.fillStyle = '#111';
        ctx.strokeStyle = this.isFrozen ? '#00bfff' : this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(-this.radius, -this.radius - 10, this.radius * 2, 4);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.radius, -this.radius - 10, (this.hp / this.maxHp) * (this.radius * 2), 4);

        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, row, towerType) {
        this.x = x;
        this.y = y;
        this.row = row;
        this.towerType = towerType;
        this.speed = 600;
        this.radius = towerType.id === 'PLASMA' ? 10 : 5;
    }

    update(dt) {
        this.x += this.speed * dt;

        for (let enemy of enemies) {
            if (enemy.row === this.row && Math.abs(enemy.x - this.x) < 25) {
                this.hit(enemy);
                return true;
            }
        }
        return this.x > canvas.width;
    }

    hit(target) {
        target.hp -= this.towerType.damage;
        createFloatingText(`-${this.towerType.damage}`, target.x, target.y - 20, '#ff3366');

        if (this.towerType.id === 'FROST') {
            target.isFrozen = true;
            target.freezeTimer = 3;
            target.currentSpeed = target.speed * this.towerType.slowFactor;
            createParticles(target.x, target.y, '#00bfff', 12);
        } else if (this.towerType.id === 'PLASMA') {
            createExplosion(this.x, this.y, '#ff0055', 40);
            GAME_STATE.shakeTime = 0.15;
            
            enemies.forEach(e => {
                if (e !== target) {
                    const dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < this.towerType.splashRadius) {
                        const splashDamage = Math.floor(this.towerType.damage * 0.5);
                        e.hp -= splashDamage;
                        createFloatingText(`-${splashDamage}`, e.x, e.y - 20, '#ff9900');
                    }
                }
            });
        } else {
            createParticles(this.x, this.y, this.towerType.color, 8);
        }
    }

    draw() {
        ctx.save();
        ctx.shadowColor = this.towerType.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = this.towerType.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class EnergyCore {
    constructor(x, y, value = 25) {
        this.x = x;
        this.y = y;
        this.targetY = Math.min(y + 40, canvas.height - 80);
        this.value = value;
        this.radius = 16;
        this.lifeTime = 8;
        this.pulse = 0;
    }

    update(dt) {
        this.lifeTime -= dt;
        this.pulse += dt * 5;
        if (this.y < this.targetY) {
            this.y += 80 * dt;
        }
        return this.lifeTime <= 0;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const glow = 12 + Math.sin(this.pulse) * 4;
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = glow;

        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0d1117';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 200;
        this.vy = (Math.random() - 0.5) * 200;
        this.alpha = 1;
        this.size = Math.random() * 4 + 2;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.alpha -= dt * 1.5;
        return this.alpha <= 0;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function createParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function createExplosion(x, y, color, radius) {
    createParticles(x, y, color, 25);
    createFloatingText('BOOM!', x, y - 30, color);
}

class FloatingText {
    constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = 1;
    }

    update(dt) {
        this.y -= 30 * dt;
        this.alpha -= dt * 1.2;
        return this.alpha <= 0;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 16px Segoe UI';
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function createFloatingText(text, x, y, color) {
    floatingTexts.push(new FloatingText(text, x, y, color));
}

const deckElement = document.getElementById('deck');
const cardCooldowns = {};

function initDeck() {
    deckElement.innerHTML = '';
    Object.keys(TOWER_TYPES).forEach(key => {
        const type = TOWER_TYPES[key];
        cardCooldowns[type.id] = 0;

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${type.id}`;
        card.innerHTML = `
            <div class="card-cost">⚡ ${type.cost}</div>
            <div class="card-name">${type.name}</div>
            <div class="card-cooldown" id="cd-${type.id}"></div>
        `;

        card.addEventListener('click', () => {
            if (GAME_STATE.energy >= type.cost && cardCooldowns[type.id] <= 0) {
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                GAME_STATE.selectedCard = type;
                card.classList.add('active');
            }
        });

        deckElement.appendChild(card);
    });
}

function updateDeckUI() {
    Object.keys(TOWER_TYPES).forEach(key => {
        const type = TOWER_TYPES[key];
        const card = document.getElementById(`card-${type.id}`);
        const cdOverlay = document.getElementById(`cd-${type.id}`);

        if (!card) return;

        const isAffordable = GAME_STATE.energy >= type.cost;
        const isCoolingDown = cardCooldowns[type.id] > 0;

        if (!isAffordable || isCoolingDown) {
            card.classList.add('disabled');
        } else {
            card.classList.remove('disabled');
        }

        if (isCoolingDown) {
            const percentage = (cardCooldowns[type.id] / type.cooldown) * 100;
            cdOverlay.style.height = `${percentage}%`;
        } else {
            cdOverlay.style.height = '0%';
        }
    });

    document.getElementById('energy-txt').innerText = Math.floor(GAME_STATE.energy);
    document.getElementById('wave-txt').innerText = GAME_STATE.wave;
    document.getElementById('hp-txt').innerText = Math.max(0, Math.floor(GAME_STATE.hp));
    document.getElementById('score-txt').innerText = GAME_STATE.score;

    const btnUlt = document.getElementById('btn-ult');
    if (GAME_STATE.ultCooldown <= 0) {
        btnUlt.disabled = false;
        btnUlt.innerText = "ORBITAL LASER (READY)";
    } else {
        btnUlt.disabled = true;
        btnUlt.innerText = `RECHARGING (${Math.ceil(GAME_STATE.ultCooldown)}s)`;
    }
}

function handleSpawning(dt) {
    spawnTimer += dt;
    energySpawnTimer += dt;

    if (energySpawnTimer > 6) {
        energySpawnTimer = 0;
        const randomX = OFFSET_X + Math.random() * (GRID_COLS * CELL_SIZE);
        const randomY = OFFSET_Y + Math.random() * (GRID_ROWS * CELL_SIZE - 100);
        energyCores.push(new EnergyCore(randomX, randomY, 25));
    }

    const spawnInterval = Math.max(1.8, 5 - GAME_STATE.wave * 0.3);
    if (spawnTimer > spawnInterval) {
        spawnTimer = 0;

        const row = Math.floor(Math.random() * GRID_ROWS);
        const rand = Math.random();

        let type = 'WALKER';
        if (rand < 0.35) type = 'DRONE';
        else if (rand < 0.70) type = 'WALKER';
        else if (rand < 0.92) type = 'ARMORED';
        else if (GAME_STATE.wave >= 3 && rand >= 0.92) type = 'BOSS';

        enemies.push(new Enemy(row, type));
    }
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    for (let i = energyCores.length - 1; i >= 0; i--) {
        const core = energyCores[i];
        if (Math.hypot(core.x - mouseX, core.y - mouseY) < 30) {
            GAME_STATE.energy += core.value;
            createFloatingText(`+${core.value} Energy`, core.x, core.y, '#00ffcc');
            createParticles(core.x, core.y, '#00ffcc', 15);
            energyCores.splice(i, 1);
            return;
        }
    }

    if (mouseX >= OFFSET_X && mouseX < OFFSET_X + GRID_COLS * CELL_SIZE &&
        mouseY >= OFFSET_Y && mouseY < OFFSET_Y + GRID_ROWS * CELL_SIZE) {

        const col = Math.floor((mouseX - OFFSET_X) / CELL_SIZE);
        const row = Math.floor((mouseY - OFFSET_Y) / CELL_SIZE);

        const isOccupied = towers.some(t => t.row === row && t.col === col);

        if (!isOccupied && GAME_STATE.selectedCard) {
            const type = GAME_STATE.selectedCard;

            if (GAME_STATE.energy >= type.cost && cardCooldowns[type.id] <= 0) {
                GAME_STATE.energy -= type.cost;
                cardCooldowns[type.id] = type.cooldown;

                towers.push(new Tower(row, col, type));
                createParticles(OFFSET_X + col * CELL_SIZE + CELL_SIZE / 2, OFFSET_Y + row * CELL_SIZE + CELL_SIZE / 2, type.color, 20);

                GAME_STATE.selectedCard = null;
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            }
        }
    }
});

document.getElementById('btn-ult').addEventListener('click', () => {
    if (GAME_STATE.ultCooldown <= 0) {
        GAME_STATE.ultCooldown = GAME_STATE.maxUltCooldown;
        GAME_STATE.shakeTime = 0.6;

        enemies.forEach(e => {
            e.hp -= 800;
            createExplosion(e.x, e.y, '#ff0055', 50);
        });

        createFloatingText('ORBITAL LASER STRIKE!', canvas.width / 2 - 100, canvas.height / 2, '#ff0055');
    }
});

function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            const x = OFFSET_X + c * CELL_SIZE;
            const y = OFFSET_Y + r * CELL_SIZE;

            ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

            ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.01)' : 'rgba(0,0,0,0.1)';
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
        }
    }

    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(OFFSET_X - 10, OFFSET_Y);
    ctx.lineTo(OFFSET_X - 10, OFFSET_Y + GRID_ROWS * CELL_SIZE);
    ctx.stroke();
}

function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    ctx.save();
    if (GAME_STATE.shakeTime > 0) {
        GAME_STATE.shakeTime -= dt;
        const dx = (Math.random() - 0.5) * 12;
        const dy = (Math.random() - 0.5) * 12;
        ctx.translate(dx, dy);
    }

    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (GAME_STATE.hp > 0) {
        handleSpawning(dt);

        Object.keys(cardCooldowns).forEach(key => {
            if (cardCooldowns[key] > 0) cardCooldowns[key] -= dt;
        });

        if (GAME_STATE.ultCooldown > 0) GAME_STATE.ultCooldown -= dt;

        GAME_STATE.score += Math.floor(dt * 10);
        GAME_STATE.wave = 1 + Math.floor(GAME_STATE.score / 600);
    }

    drawGrid();

    towers.forEach(t => { t.update(now); t.draw(); });

    for (let i = projectiles.length - 1; i >= 0; i--) {
        if (projectiles[i].update(dt)) projectiles.splice(i, 1);
        else projectiles[i].draw();
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.update(dt);
        e.draw();
        if (e.hp <= 0) {
            GAME_STATE.score += e.score;
            createParticles(e.x, e.y, e.color, 20);
            enemies.splice(i, 1);
        }
    }

    for (let i = energyCores.length - 1; i >= 0; i--) {
        if (energyCores[i].update(dt)) energyCores.splice(i, 1);
        else energyCores[i].draw();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].update(dt)) particles.splice(i, 1);
        else particles[i].draw();
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        if (floatingTexts[i].update(dt)) floatingTexts.splice(i, 1);
        else floatingTexts[i].draw();
    }

    ctx.restore();

    if (GAME_STATE.hp <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 48px Segoe UI';
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.fillText('SYSTEM OVERRIDDEN - GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = '24px Segoe UI';
        ctx.fillStyle = '#00ffcc';
        ctx.fillText(`FINAL SCORE: ${GAME_STATE.score} | SURVIVED WAVES: ${GAME_STATE.wave}`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText('Refresh page to restart system', canvas.width / 2, canvas.height / 2 + 80);
    } else {
        updateDeckUI();
        requestAnimationFrame(gameLoop);
    }
}

initDeck();
requestAnimationFrame(gameLoop);
</script>
