<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON SNAKE — งูกินอัญมณี</title>
<style>
  :root{
    --bg:#05060f;
    --cyan:#00f0ff;
    --magenta:#ff2d95;
    --gold:#ffd23f;
    --purple:#a855f7;
    --green:#22ff88;
    --red:#ff3b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#eaf6ff;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas{display:block;position:fixed;inset:0;}

  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.22;animation:float 16s ease-in-out infinite;}
  .o1{width:420px;height:420px;background:var(--green);top:-120px;left:-100px;}
  .o2{width:380px;height:380px;background:var(--cyan);bottom:-120px;right:-80px;animation-delay:-6s;}
  .o3{width:300px;height:300px;background:var(--purple);top:40%;left:60%;animation-delay:-11s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;z-index:10;
    background:radial-gradient(circle at 50% 40%,rgba(34,255,136,.08),transparent 60%);}

  .title{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:900;letter-spacing:.05em;
    background:linear-gradient(90deg,var(--green),var(--cyan),var(--gold));
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(34,255,136,.5));
    animation:shine 4s linear infinite;}
  @keyframes shine{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}

  .sub{font-size:clamp(.9rem,2.5vw,1.2rem);color:#9fb6c9;margin-top:.4rem;letter-spacing:.2em;}

  .btn{margin-top:2rem;padding:1rem 3rem;font-size:1.2rem;font-weight:700;letter-spacing:.15em;
    border:2px solid var(--green);border-radius:999px;background:transparent;color:var(--green);
    cursor:pointer;transition:.25s;text-transform:uppercase;}
  .btn:hover{background:var(--green);color:#04121a;box-shadow:0 0 30px var(--green);transform:scale(1.05);}
  .btn.back{margin-top:1rem;border-color:#5f7688;color:#8fa6b8;font-size:.9rem;padding:.7rem 2rem;}
  .btn.back:hover{background:#5f7688;color:#04121a;box-shadow:0 0 20px #5f7688;}

  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:1rem 1.4rem;z-index:5;pointer-events:none;}
  .hud .score{font-size:2rem;font-weight:800;color:#fff;text-shadow:0 0 12px var(--green);}
  .hud .combo{font-size:1.1rem;font-weight:700;color:var(--gold);text-shadow:0 0 10px var(--gold);}
  .hud .best{font-size:.9rem;color:#7f96a8;}
  .hud .right{text-align:right;}
  .hud .level{font-size:1rem;font-weight:700;color:var(--purple);text-shadow:0 0 10px var(--purple);}

  .hint{position:fixed;bottom:1rem;left:0;right:0;text-align:center;color:#5f7688;
    font-size:.8rem;z-index:5;pointer-events:none;letter-spacing:.1em;}
  .hidden{display:none!important;}

  .music-btn{position:fixed;bottom:1.2rem;right:1.2rem;z-index:20;width:48px;height:48px;
    border-radius:50%;border:2px solid var(--cyan);background:rgba(0,240,255,.08);
    color:var(--cyan);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.3s;backdrop-filter:blur(6px);}
  .music-btn:hover{background:var(--cyan);color:#04121a;box-shadow:0 0 25px var(--cyan);transform:scale(1.1);}
  .music-btn.off{opacity:.5;border-color:#5f7688;color:#5f7688;background:rgba(95,118,136,.1);}
  .music-btn.off:hover{background:#5f7688;color:#04121a;box-shadow:0 0 20px #5f7688;}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="right">
    <div class="level" id="level">LEVEL 1</div>
    <div class="best" id="best">BEST 0</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">NEON SNAKE</div>
  <div class="sub">กินอัญมณี · โตขึ้น · ทำลายสถิติ</div>
  <button class="btn" id="startBtn">เริ่มเล่น</button>
  <button class="btn back" id="backBtn">← กลับเมนู</button>
  <div class="sub" style="margin-top:1.5rem;font-size:.8rem;color:#5f7688;">
    ⌨️ ลูกศร / WASD · 👆 ปัดนิ้ว · 🖱️ คลิกทิศทาง
  </div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="title" style="font-size:clamp(2.5rem,8vw,4.5rem);">GAME OVER</div>
  <div class="sub" id="finalScore" style="font-size:1.4rem;color:#fff;"></div>
  <div class="sub" id="newBest" style="color:var(--gold);"></div>
  <div class="sub" id="encourage" style="color:var(--cyan);margin-top:.6rem;font-size:1.1rem;"></div>
  <button class="btn" id="restartBtn">เล่นอีกครั้ง</button>
  <button class="btn back" id="backBtn2">← กลับเมนู</button>
</div>

<div class="hint">กด P เพื่อหยุดชั่วคราว</div>
<button class="music-btn" id="musicBtn" title="เปิด/ปิดเพลง">🔊</button>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;

  const CELL = 22;
  let cols=0, rows=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cols = Math.floor(W/CELL); rows = Math.floor(H/CELL);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  let AC=null;
  function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
  function beep(freq, dur=0.08, type='sine', vol=0.12, slide=0){
    try{
      const a=audio(), t=a.currentTime;
      const o=a.createOscillator(), g=a.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  const sfx = {
    eat:()=>beep(700,.08,'sine',.14,200),
    combo:(n)=>beep(500+n*60,.1,'triangle',.14,200),
    power:()=>beep(520,.18,'sine',.16,400),
    die:()=>{beep(300,.3,'sawtooth',.18,-200); beep(120,.4,'square',.12,-60);},
    levelup:()=>{beep(440,.1,'sine',.14,200); setTimeout(()=>beep(660,.12,'sine',.14,200),100);},
    start:()=>beep(440,.12,'sine',.15,200),
  };

  // ---------- State ----------
  const S = {
    state:'menu',
    score:0, best:+(localStorage.getItem('neonsnake_best')||0),
    combo:0, maxCombo:0,
    level:1, time:0,
    dir:{x:1,y:0}, nextDir:{x:1,y:0},
    moveT:0, speed:8,
    shake:0, flash:0,
  };

  let snake=[], food=null, power=null, particles=[], stars=[], trail=[];
  let powerT=0, powerActive=0, powerType=null;

  function initStars(){
    stars=[];
    for(let i=0;i<80;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.4+0.3, v:Math.random()*0.4+0.1, tw:Math.random()*Math.PI*2});
  }
  initStars();

  // ---------- Helpers ----------
  function rand(a,b){ return a+Math.random()*(b-a); }
  function glow(color, blur=15){ ctx.shadowColor=color; ctx.shadowBlur=blur; }
  function noGlow(){ ctx.shadowBlur=0; }
  function spawnParticles(x,y,color,n=10,speed=3){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=rand(1,speed);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:rand(.03,.06),r:rand(1.5,3.5),color});
    }
  }
  function randomCell(){
    return {x:Math.floor(rand(1,cols-1)), y:Math.floor(rand(1,rows-1))};
  }
  function cellFree(x,y){
    for(const s of snake) if(s.x===x&&s.y===y) return false;
    if(food && food.x===x && food.y===y) return false;
    if(power && power.x===x && power.y===y) return false;
    return true;
  }
  function placeFood(){
    let c;
    do{ c=randomCell(); }while(!cellFree(c.x,c.y));
    food={x:c.x,y:c.y,type:Math.random()<0.2?'gold':'normal',spawn:0};
  }
  function placePower(){
    let c;
    do{ c=randomCell(); }while(!cellFree(c.x,c.y));
    power={x:c.x,y:c.y,type:['slow','double','shrink','ghost'][Math.floor(Math.random()*4)],spawn:0};
  }

  // ---------- Game flow ----------
  function start(){
    S.state='play'; S.score=0; S.combo=0; S.maxCombo=0; S.level=1; S.time=0;
    S.dir={x:1,y:0}; S.nextDir={x:1,y:0}; S.speed=8; S.shake=0; S.flash=0;
    S.moveT=0; powerT=0; powerActive=0; powerType=null;
    particles=[]; trail=[];
    const cy=Math.floor(rows/2), cx=Math.floor(cols/2);
    snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    food=null; power=null;
    placeFood();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    sfx.start();
  }
  function gameOver(){
    S.state='over'; sfx.die();
    stopMusic();
    const head=snake[0];
    const hx=head.x*CELL+CELL/2, hy=head.y*CELL+CELL/2;
    spawnParticles(hx,hy,'#22ff88',40,8);
    spawnParticles(hx,hy,'#ff2d95',30,7);
    spawnParticles(hx,hy,'#00f0ff',30,7);
    S.shake=20;
    const isNewBest = S.score > S.best;
    if(isNewBest){ S.best=Math.floor(S.score); localStorage.setItem('neonsnake_best',S.best); }
    document.getElementById('finalScore').textContent='คะแนน '+Math.floor(S.score);
    document.getElementById('newBest').textContent = isNewBest ? '🏆 สถิติใหม่!' : '';
    let msg;
    if(isNewBest){
      msg = '🏆 สถิติใหม่! เก่งมาก มาทำลายสถิติตัวเองอีกครั้ง!';
    } else if(S.best > 0 && S.score >= S.best*0.8){
      msg = '🔥 เกือบถึงสถิติแล้ว! อีกนิดเดียว ลองอีกครั้ง!';
    } else {
      msg = '💪 เก่งขึ้นทุกครั้งที่เล่น อย่าหยุดแค่นี้!';
    }
    document.getElementById('encourage').textContent = msg;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  }
  function pause(){ S.state='pause'; }
  function resume(){ S.state='play'; last=performance.now(); }

  document.getElementById('startBtn').onclick=start;
  document.getElementById('restartBtn').onclick=start;
  document.getElementById('backBtn').onclick=()=>location.href='index.html';
  document.getElementById('backBtn2').onclick=()=>location.href='index.html';

  // ---------- Input ----------
  function setDir(x,y){
    if(x===-S.dir.x && y===-S.dir.y) return;
    S.nextDir={x,y};
  }
  window.addEventListener('keydown', e=>{
    if(e.key==='p'||e.key==='P'){ if(S.state==='play') pause(); else if(S.state==='pause') resume(); return; }
    const k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') setDir(-1,0);
    else if(k==='arrowright'||k==='d') setDir(1,0);
    else if(k==='arrowup'||k==='w') setDir(0,-1);
    else if(k==='arrowdown'||k==='s') setDir(0,1);
  });

  let touchStart=null;
  canvas.addEventListener('touchstart', e=>{ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
  canvas.addEventListener('touchmove', e=>{
    if(!touchStart) return;
    const dx=e.touches[0].clientX-touchStart.x, dy=e.touches[0].clientY-touchStart.y;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(dy>0?1:-1,0);
    touchStart=null;
  });

  canvas.addEventListener('click', e=>{
    if(S.state!=='play') return;
    const head=snake[0];
    const hx=head.x*CELL+CELL/2, hy=head.y*CELL+CELL/2;
    const dx=e.clientX-hx, dy=e.clientY-hy;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(dy>0?1:-1,0);
  });

  // ---------- Update ----------
  function update(dt){
    if(S.state!=='play') return;
    S.time += dt;

    if(powerActive>0){
      powerActive-=dt;
      if(powerActive<=0) powerType=null;
    }
    powerT-=dt;
    if(powerT<=0 && !power){ placePower(); powerT=rand(8,14); }

    if(food) food.spawn+=dt;
    if(power) power.spawn+=dt;

    S.moveT += dt*S.speed;
    if(S.moveT>=1){
      S.moveT=0;
      S.dir=S.nextDir;
      const head=snake[0];
      let nx=head.x+S.dir.x, ny=head.y+S.dir.y;

      if(powerType==='ghost'){
        if(nx<0) nx=cols-1; if(nx>=cols) nx=0;
        if(ny<0) ny=rows-1; if(ny>=rows) ny=0;
      } else {
        if(nx<0||nx>=cols||ny<0||ny>=rows){ gameOver(); return; }
      }

      if(powerType!=='ghost'){
        for(const s of snake) if(s.x===nx&&s.y===ny){ gameOver(); return; }
      }

      snake.unshift({x:nx,y:ny});

      trail.push({x:head.x*CELL+CELL/2, y:head.y*CELL+CELL/2, life:1});

      if(food && nx===food.x && ny===food.y){
        S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
        const gain = (food.type==='gold'?150:50) * (1+S.combo*0.1) * (powerType==='double'?2:1);
        S.score += gain;
        if(S.combo>1) sfx.combo(Math.min(S.combo,10)); else sfx.eat();
        const fx=nx*CELL+CELL/2, fy=ny*CELL+CELL/2;
        spawnParticles(fx,fy, food.type==='gold'?'#ffd23f':'#22ff88', 16, 5);
        S.flash = food.type==='gold'?0.4:0.15;
        food=null; placeFood();
        if(S.combo%5===0){ S.level++; S.speed=Math.min(20, 8+S.level*1.2); sfx.levelup(); S.flash=0.5; }
      } else {
        snake.pop();
      }

      if(power && nx===power.x && ny===power.y){
        sfx.power();
        spawnParticles(nx*CELL+CELL/2, ny*CELL+CELL/2, '#a855f7', 20, 6);
        powerType=power.type; powerActive=6;
        if(power.type==='slow') S.speed=Math.max(4,S.speed-3);
        if(power.type==='shrink'){ if(snake.length>3) snake.splice(snake.length-3); }
        power=null;
      }
    }

    for(let i=trail.length-1;i>=0;i--){
      trail[i].life-=dt*2.5;
      if(trail[i].life<=0) trail.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay; p.vx*=0.98; p.vy*=0.98;
      if(p.life<=0) particles.splice(i,1);
    }

    for(const s of stars){ s.y+=s.v*dt*60; if(s.y>H){ s.y=-2; s.x=Math.random()*W; } }

    S.shake=Math.max(0,S.shake-dt*30);
    S.flash=Math.max(0,S.flash-dt*2);
  }

  // ---------- Render ----------
  function render(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#05060f'); g.addColorStop(1,'#0a0d1f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='rgba(0,240,255,.04)'; ctx.lineWidth=1;
    for(let x=0;x<=cols;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
    for(let y=0;y<=rows;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

    for(const s of stars){
      const a=0.3+Math.sin(s.tw+S.time*2)*0.3;
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle='#3a4a5f';
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }
    ctx.globalAlpha=1;

    ctx.save();
    if(S.shake>0) ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));

    for(const t of trail){
      ctx.globalAlpha=t.life*0.4;
      ctx.fillStyle='#00f0ff'; glow('#00f0ff',12);
      ctx.beginPath(); ctx.arc(t.x,t.y,CELL*0.3*t.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    if(food){
      const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
      const scale=Math.min(1, food.spawn*4);
      const pulse=1+Math.sin(S.time*6)*0.15;
      ctx.save(); ctx.translate(fx,fy); ctx.scale(pulse*scale,pulse*scale);
      if(food.type==='gold'){
        ctx.strokeStyle='#ffd23f'; glow('#ffd23f',20); ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,CELL*0.45,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='#ffd23f'; glow('#ffd23f',16);
        ctx.beginPath(); ctx.arc(0,0,CELL*0.3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; glow('#fff',8);
        ctx.beginPath(); ctx.arc(-CELL*0.08,-CELL*0.08,CELL*0.1,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle='#22ff88'; glow('#22ff88',14);
        ctx.beginPath();
        ctx.moveTo(0,-CELL*0.4); ctx.lineTo(CELL*0.3,0); ctx.lineTo(0,CELL*0.4); ctx.lineTo(-CELL*0.3,0);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff'; glow('#fff',6);
        ctx.beginPath(); ctx.arc(0,-CELL*0.1,CELL*0.08,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    if(power){
      const px=power.x*CELL+CELL/2, py=power.y*CELL+CELL/2;
      const scale=Math.min(1, power.spawn*4);
      const col={slow:'#4d7cff',double:'#ffd23f',shrink:'#ff2d95',ghost:'#a855f7'}[power.type];
      ctx.save(); ctx.translate(px,py); ctx.scale(scale,scale);
      ctx.strokeStyle=col; glow(col,18); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,CELL*0.5,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=col; glow(col,16);
      ctx.beginPath(); ctx.arc(0,0,CELL*0.35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#05060f'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const icon={slow:'🐌',double:'x2',shrink:'✂',ghost:'👻'}[power.type];
      ctx.fillText(icon,0,1);
      ctx.restore();
    }

    // snake (premium: gradient + glow + rounded body)
    if(snake.length > 0){
      const head=snake[0];
      for(let i=snake.length-1;i>=0;i--){
        const s=snake[i];
        const x=s.x*CELL+CELL/2, y=s.y*CELL+CELL/2;
        const t=i/snake.length;
        const r=CELL*0.44*(1-t*0.35);
        const hue=160 - t*70;
        const col=`hsl(${hue},100%,${60-t*15}%)`;
        ctx.fillStyle=col; glow(col, i===0?24:12);
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.35)'; noGlow();
        ctx.beginPath(); ctx.arc(x-r*0.25,y-r*0.25,r*0.4,0,Math.PI*2); ctx.fill();
      }

      const hx=head.x*CELL+CELL/2, hy=head.y*CELL+CELL/2;
      const ex=S.dir.x*CELL*0.15, ey=S.dir.y*CELL*0.15;
      ctx.fillStyle='#fff'; glow('#fff',10);
      ctx.beginPath(); ctx.arc(hx+ex-ey*0.3, hy+ey+ex*0.3, CELL*0.12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+ex+ey*0.3, hy+ey-ex*0.3, CELL*0.12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#05060f'; noGlow();
      ctx.beginPath(); ctx.arc(hx+ex*1.3-ey*0.3, hy+ey*1.3+ex*0.3, CELL*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+ex*1.3+ey*0.3, hy+ey*1.3-ex*0.3, CELL*0.05,0,Math.PI*2); ctx.fill();
    }

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color; glow(p.color,8);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
    noGlow();

    if(S.flash>0){
      ctx.fillStyle=`rgba(255,255,255,${S.flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }

    document.getElementById('score').textContent=Math.floor(S.score);
    document.getElementById('best').textContent='BEST '+S.best;
    document.getElementById('level').textContent='LEVEL '+S.level;
    const comboEl=document.getElementById('combo');
    if(S.combo>=2){ comboEl.textContent='COMBO x'+S.combo; }
    else comboEl.textContent='';
    if(powerType){
      const label={slow:'🐌 ช้า',double:'✨ x2',shrink:'✂ หด',ghost:'👻 ทะลุกำแพง'}[powerType];
      comboEl.textContent += (comboEl.textContent?'  ':'') + label + ' '+powerActive.toFixed(1);
    }
  }

  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.1) dt=0.1;
    if(S.state==='play') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ===== THEME MUSIC: Pixel Playground =====
  let musicGain=null, musicOn=false, musicTimer=null, musicStep=0;
  const musicBeat=0.5;
  const musicChords=[
    [130.81,164.81,196,261.63],
    [196,246.94,293.66,392],
    [220,261.63,329.63,440],
    [174.61,220,261.63,349.23],
  ];
  const musicBass=[65.41,98,110,87.31];
  const musicMelody=[523.25,587.33,659.25,587.33,523.25,493.88,440,493.88];

  function playNote(freq,time,dur,type,vol,dest){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,time);
    g.gain.setValueAtTime(0,time);
    g.gain.linearRampToValueAtTime(vol,time+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    o.connect(g); g.connect(dest); o.start(time); o.stop(time+dur+0.05);
  }
  function scheduleMusicStep(t,stepIdx){
    const chord=musicChords[stepIdx%4], bass=musicBass[stepIdx%4];
    playNote(bass,t,musicBeat*0.5,'square',0.09,musicGain);
    playNote(bass*1.5,t+musicBeat,musicBeat*0.5,'square',0.07,musicGain);
    chord.forEach(f=>playNote(f,t,musicBeat*0.8,'triangle',0.05,musicGain));
    playNote(chord[stepIdx%chord.length]*2,t,musicBeat*0.4,'square',0.07,musicGain);
    playNote(chord[(stepIdx+1)%chord.length]*2,t+musicBeat*0.5,musicBeat*0.4,'square',0.07,musicGain);
    if(stepIdx%2===0) playNote(musicMelody[(stepIdx/2)%musicMelody.length],t,musicBeat*1.0,'sine',0.08,musicGain);
  }
  function startMusic(){
    if(musicOn) return;
    const a=audio(); if(a.state==='suspended') a.resume();
    musicGain=a.createGain(); musicGain.gain.setValueAtTime(0.5,a.currentTime);
    musicGain.connect(a.destination); musicOn=true; musicStep=0;
    const lookahead=0.1; let nextTime=a.currentTime+0.05;
    musicTimer=setInterval(()=>{
      while(nextTime<a.currentTime+lookahead){
        scheduleMusicStep(nextTime,musicStep);
        nextTime+=musicBeat; musicStep++;
      }
    },50);
  }
  function stopMusic(){
    if(!musicOn) return;
    clearInterval(musicTimer); musicTimer=null;
    if(musicGain){ musicGain.gain.setTargetAtTime(0,AC.currentTime,0.1); setTimeout(()=>{if(musicGain)musicGain.disconnect();musicGain=null;},500); }
    musicOn=false;
  }
  function hoverSound(){
    if(!musicOn) return;
    const a=audio(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(600,t);
    o.frequency.exponentialRampToValueAtTime(900,t+0.08);
    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.15);
  }
  function clickSound(){
    const a=audio(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(500,t);
    o.frequency.exponentialRampToValueAtTime(300,t+0.1);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.18);
  }
  const musicBtn=document.getElementById('musicBtn');
  musicBtn.addEventListener('click',()=>{
    if(musicOn){ stopMusic(); musicBtn.textContent='🔇'; musicBtn.classList.add('off'); }
    else { startMusic(); musicBtn.textContent='🔊'; musicBtn.classList.remove('off'); }
  });
  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('mouseenter',hoverSound);
    b.addEventListener('click',clickSound);
  });
  function autoStartMusic(){
    if(!musicOn){ startMusic(); musicBtn.textContent='🔊'; musicBtn.classList.remove('off'); }
    document.removeEventListener('click',autoStartMusic);
    document.removeEventListener('keydown',autoStartMusic);
  }
  document.addEventListener('click',autoStartMusic);
  document.addEventListener('keydown',autoStartMusic);
})();
</script>
