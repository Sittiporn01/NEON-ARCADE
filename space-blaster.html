<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPACE BLASTER — เกมยิงอวกาศ</title>
<style>
  :root{
    --bg:#03040c;
    --cyan:#00f0ff;
    --magenta:#ff2d95;
    --gold:#ffd23f;
    --purple:#a855f7;
    --green:#22ff88;
    --red:#ff3b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#eaf6ff;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas{display:block;position:fixed;inset:0;}

  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.22;animation:float 16s ease-in-out infinite;}
  .o1{width:420px;height:420px;background:var(--purple);top:-120px;left:-100px;}
  .o2{width:380px;height:380px;background:var(--magenta);bottom:-120px;right:-80px;animation-delay:-6s;}
  .o3{width:300px;height:300px;background:var(--cyan);top:40%;left:60%;animation-delay:-11s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;z-index:10;
    background:radial-gradient(circle at 50% 40%,rgba(0,240,255,.08),transparent 60%);}

  .title{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:900;letter-spacing:.05em;
    background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--gold),var(--cyan));
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,240,255,.5));
    animation:shine 4s linear infinite;}
  @keyframes shine{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}

  .sub{font-size:clamp(.9rem,2.5vw,1.2rem);color:#9fb6c9;margin-top:.4rem;letter-spacing:.2em;}

  .btn{margin-top:2rem;padding:1rem 3rem;font-size:1.2rem;font-weight:700;letter-spacing:.15em;
    border:2px solid var(--cyan);border-radius:999px;background:transparent;color:var(--cyan);
    cursor:pointer;transition:.25s;text-transform:uppercase;}
  .btn:hover{background:var(--cyan);color:#04121a;box-shadow:0 0 30px var(--cyan);transform:scale(1.05);}
  .btn.back{margin-top:1rem;border-color:#5f7688;color:#8fa6b8;font-size:.9rem;padding:.7rem 2rem;}
  .btn.back:hover{background:#5f7688;color:#04121a;box-shadow:0 0 20px #5f7688;}

  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:1rem 1.4rem;z-index:5;pointer-events:none;}
  .hud .score{font-size:2rem;font-weight:800;color:#fff;text-shadow:0 0 12px var(--cyan);}
  .hud .combo{font-size:1.1rem;font-weight:700;color:var(--gold);text-shadow:0 0 10px var(--gold);}
  .hud .best{font-size:.9rem;color:#7f96a8;}
  .hud .right{text-align:right;}
  .hud .level{font-size:1rem;font-weight:700;color:var(--purple);text-shadow:0 0 10px var(--purple);}

  .hint{position:fixed;bottom:1rem;left:0;right:0;text-align:center;color:#5f7688;
    font-size:.8rem;z-index:5;pointer-events:none;letter-spacing:.1em;}
  .hidden{display:none!important;}

  .music-btn{position:fixed;bottom:1.2rem;right:1.2rem;z-index:20;width:48px;height:48px;
    border-radius:50%;border:2px solid var(--cyan);background:rgba(0,240,255,.08);
    color:var(--cyan);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.3s;backdrop-filter:blur(6px);}
  .music-btn:hover{background:var(--cyan);color:#04121a;box-shadow:0 0 25px var(--cyan);transform:scale(1.1);}
  .music-btn.off{opacity:.5;border-color:#5f7688;color:#5f7688;background:rgba(95,118,136,.1);}
  .music-btn.off:hover{background:#5f7688;color:#04121a;box-shadow:0 0 20px #5f7688;}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="right">
    <div class="level" id="level">LEVEL 1</div>
    <div class="best" id="best">BEST 0</div>
    <div class="best" id="lives"></div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">SPACE BLASTER</div>
  <div class="sub">ยิงศัตรู · เลเวลอัป · สู้บอส</div>
  <button class="btn" id="startBtn">เริ่มเล่น</button>
  <button class="btn back" id="backBtn">← กลับเมนู</button>
  <div class="sub" style="margin-top:1.5rem;font-size:.8rem;color:#5f7688;">
    🖱️ เลื่อนเมาส์ / 👆 ลากนิ้ว / ⌨️ ลูกศร หรือ WASD · ยิงอัตโนมัติ
  </div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="title" style="font-size:clamp(2.5rem,8vw,4.5rem);">GAME OVER</div>
  <div class="sub" id="finalScore" style="font-size:1.4rem;color:#fff;"></div>
  <div class="sub" id="newBest" style="color:var(--gold);"></div>
  <div class="sub" id="encourage" style="color:var(--cyan);margin-top:.6rem;font-size:1.1rem;"></div>
  <button class="btn" id="restartBtn">เล่นอีกครั้ง</button>
  <button class="btn back" id="backBtn2">← กลับเมนู</button>
</div>

<div class="hint">กด P เพื่อหยุดชั่วคราว</div>
<button class="music-btn" id="musicBtn" title="เปิด/ปิดเพลง">🔊</button>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  let AC=null;
  function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
  function beep(freq, dur=0.08, type='sine', vol=0.12, slide=0){
    try{
      const a=audio(), t=a.currentTime;
      const o=a.createOscillator(), g=a.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  const sfx = {
    shoot:()=>beep(700,.05,'square',.05,-200),
    hit:()=>beep(200,.08,'sawtooth',.1,-60),
    explode:()=>{beep(120,.3,'sawtooth',.18,-80); beep(60,.4,'square',.12,-30);},
    power:()=>beep(520,.18,'sine',.16,400),
    levelup:()=>{beep(440,.1,'sine',.14,200); setTimeout(()=>beep(660,.12,'sine',.14,200),100); setTimeout(()=>beep(880,.15,'sine',.14,200),200);},
    boss:()=>{beep(200,.5,'sawtooth',.2,-100);},
    over:()=>beep(400,.4,'sawtooth',.18,-300),
    start:()=>beep(440,.12,'sine',.15,200),
  };

  // ---------- State ----------
  const S = {
    state:'menu',
    score:0, best:+(localStorage.getItem('spaceblaster_best')||0),
    combo:0, maxCombo:0,
    time:0, level:1, levelT:0,
    lives:3, shake:0, flash:0,
    fireT:0, spawnT:0, powerT:0,
    weapon:1, weaponT:0, rapidT:0,
    bossActive:false, boss:null,
  };

  const player = { x:0, y:0, r:16, targetX:0, targetY:0 };
  let enemies=[], bullets=[], ebullets=[], powers=[], particles=[], stars=[], trail=[];

  function initStars(){
    stars=[];
    for(let i=0;i<120;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+0.4, v:Math.random()*2+0.5, tw:Math.random()*Math.PI*2});
  }
  initStars();

  // ---------- Input ----------
  const keys={};
  let pointerActive=false;
  function setTarget(x,y){ player.targetX=x; player.targetY=y; pointerActive=true; }
  canvas.addEventListener('pointermove', e=>setTarget(e.clientX,e.clientY));
  canvas.addEventListener('pointerdown', e=>setTarget(e.clientX,e.clientY));
  window.addEventListener('keydown', e=>{
    if(e.key==='p'||e.key==='P'){ if(S.state==='play') pause(); else if(S.state==='pause') resume(); }
    keys[e.key.toLowerCase()]=true;
  });
  window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

  // ---------- Helpers ----------
  function rand(a,b){ return a+Math.random()*(b-a); }
  function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
  function glow(color, blur=15){ ctx.shadowColor=color; ctx.shadowBlur=blur; }
  function noGlow(){ ctx.shadowBlur=0; }
  function spawnParticles(x,y,color,n=12,speed=4){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=rand(1,speed);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:rand(.02,.05),r:rand(1.5,4),color});
    }
  }

  // ---------- Spawning ----------
  function spawnEnemy(){
    const types=['grunt','speeder','tank','shooter'];
    const t=types[Math.floor(Math.random()*types.length)];
    const x=rand(30,W-30);
    const base={x,y:-30,type:t,rot:0,fireT:rand(1,3),spawn:0};
    if(t==='grunt'){ base.r=18; base.hp=1; base.speed=rand(80,140); base.color='#ff5c33'; base.score=100; }
    if(t==='speeder'){ base.r=13; base.hp=1; base.speed=rand(180,260); base.color='#ffd23f'; base.score=150; }
    if(t==='tank'){ base.r=28; base.hp=4; base.speed=rand(40,70); base.color='#a855f7'; base.score=300; }
    if(t==='shooter'){ base.r=20; base.hp=2; base.speed=rand(60,100); base.color='#00f0ff'; base.score=200; }
    enemies.push(base);
  }
  function spawnPower(){
    const types=['weapon','rapid','life','bomb'];
    const t=types[Math.floor(Math.random()*types.length)];
    powers.push({x:rand(30,W-30),y:-20,r:14,type:t,vy:rand(70,100),spawn:0});
  }
  function spawnBoss(){
    S.bossActive=true;
    S.boss={x:W/2,y:-80,r:55,hp:30+S.level*10,maxhp:30+S.level*10,speed:60,dir:1,fireT:1.5,phase:0,spawn:0};
    sfx.boss();
  }

  // ---------- Game flow ----------
  function start(){
    S.state='play'; S.score=0; S.combo=0; S.maxCombo=0; S.time=0;
    S.level=1; S.levelT=0; S.lives=3; S.shake=0; S.flash=0;
    S.weapon=1; S.weaponT=0; S.rapidT=0; S.bossActive=false; S.boss=null;
    S.fireT=0; S.spawnT=0; S.powerT=0;
    enemies=[]; bullets=[]; ebullets=[]; powers=[]; particles=[]; trail=[];
    player.x=W/2; player.y=H*0.8; player.targetX=player.x; player.targetY=player.y;
    pointerActive=false;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    sfx.start();
  }
  function gameOver(){
    S.state='over'; sfx.over();
    stopMusic();
    spawnParticles(player.x,player.y,'#ff2d95',40,8);
    spawnParticles(player.x,player.y,'#00f0ff',30,7);
    S.shake=20;
    const isNewBest = S.score > S.best;
    if(isNewBest){ S.best=Math.floor(S.score); localStorage.setItem('spaceblaster_best',S.best); }
    document.getElementById('finalScore').textContent = 'คะแนน '+Math.floor(S.score);
    document.getElementById('newBest').textContent = isNewBest ? '🏆 สถิติใหม่!' : '';
    let msg;
    if(isNewBest){
      msg = '🏆 สถิติใหม่! เก่งมาก มาทำลายสถิติตัวเองอีกครั้ง!';
    } else if(S.best > 0 && S.score >= S.best*0.8){
      msg = '🔥 เกือบถึงสถิติแล้ว! อีกนิดเดียว ลองอีกครั้ง!';
    } else {
      msg = '💪 เก่งขึ้นทุกครั้งที่เล่น อย่าหยุดแค่นี้!';
    }
    document.getElementById('encourage').textContent = msg;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
  }
  function pause(){ S.state='pause'; }
  function resume(){ S.state='play'; last=performance.now(); }

  document.getElementById('startBtn').onclick=start;
  document.getElementById('restartBtn').onclick=start;
  document.getElementById('backBtn').onclick=()=>location.href='index.html';
  document.getElementById('backBtn2').onclick=()=>location.href='index.html';

  // ---------- Shooting ----------
  function fire(){
    const px=player.x, py=player.y;
    const mk=(dx,dy)=>{ bullets.push({x:px+dx,y:py,dx,dy,r:4,speed:520,color:'#00f0ff'}); };
    if(S.weapon===1){ mk(0,-1); }
    else if(S.weapon===2){ mk(-6,-1); mk(6,-1); }
    else if(S.weapon===3){ mk(0,-1); mk(-8,-0.9); mk(8,-0.9); }
    else if(S.weapon===4){ mk(0,-1); mk(-10,-0.85); mk(10,-0.85); mk(-16,-0.6); mk(16,-0.6); }
    sfx.shoot();
  }

  // ---------- Update ----------
  function update(dt){
    if(S.state!=='play') return;
    S.time += dt;

    S.levelT += dt;
    const levelDuration = 20;
    if(S.levelT >= levelDuration && !S.bossActive){
      S.level++; S.levelT=0; sfx.levelup();
      spawnParticles(player.x,player.y,'#a855f7',30,6);
      spawnBoss();
    }

    const ksp=16;
    let kx=0,ky=0;
    if(keys['arrowleft']||keys['a']) kx-=1;
    if(keys['arrowright']||keys['d']) kx+=1;
    if(keys['arrowup']||keys['w']) ky-=1;
    if(keys['arrowdown']||keys['s']) ky+=1;
    if(kx||ky){ pointerActive=false; const m=Math.hypot(kx,ky); kx/=m; ky/=m; }

    if(pointerActive){
      const lerp=1-Math.pow(0.0001,dt);
      player.x+=(player.targetX-player.x)*lerp;
      player.y+=(player.targetY-player.y)*lerp;
    } else if(kx||ky){
      player.x+=kx*ksp*60*dt; player.y+=ky*ksp*60*dt;
    }
    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y));

    // engine trail
    trail.push({x:player.x, y:player.y+player.r, life:1});

    S.weaponT=Math.max(0,S.weaponT-dt);
    S.rapidT=Math.max(0,S.rapidT-dt);
    if(S.weaponT<=0) S.weapon=1;

    S.fireT-=dt;
    const fireRate = S.rapidT>0 ? 0.08 : 0.16;
    if(S.fireT<=0){ fire(); S.fireT=fireRate; }

    S.spawnT-=dt;
    if(S.spawnT<=0 && !S.bossActive){
      spawnEnemy();
      S.spawnT=Math.max(0.4, 1.2 - S.level*0.08)*rand(0.7,1.3);
    }
    S.powerT-=dt;
    if(S.powerT<=0){ spawnPower(); S.powerT=rand(8,14); }

    for(const e of enemies) e.spawn+=dt*4;
    for(const p of powers) p.spawn+=dt*4;
    if(S.boss) S.boss.spawn+=dt*2;

    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.y += e.speed*dt;
      e.fireT -= dt;
      if(e.type==='shooter' && e.fireT<=0 && e.y>0 && e.y<H*0.6){
        ebullets.push({x:e.x,y:e.y,dx:0,dy:1,r:5,speed:220,color:'#ff2d95'});
        e.fireT=rand(1.5,3);
      }
      if(e.y-e.r>H+40){ enemies.splice(i,1); continue; }
      if(dist(player.x,player.y,e.x,e.y) < player.r+e.r){
        hitPlayer(); enemies.splice(i,1); continue;
      }
    }

    if(S.bossActive && S.boss){
      const b=S.boss;
      b.x += b.speed*b.dir*dt;
      if(b.x<b.r||b.x>W-b.r) b.dir*=-1;
      if(b.y<100) b.y += 40*dt;
      b.fireT -= dt;
      if(b.fireT<=0){
        for(let a=-0.5;a<=0.5;a+=0.25){
          ebullets.push({x:b.x,y:b.y,dx:Math.sin(a),dy:1,r:6,speed:200,color:'#ff2d95'});
        }
        b.fireT=1.2;
      }
      if(dist(player.x,player.y,b.x,b.y) < player.r+b.r){ hitPlayer(); }
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.x+=b.dx*b.speed*dt; b.y+=b.dy*b.speed*dt;
      if(b.y<-20||b.x<-20||b.x>W+20){ bullets.splice(i,1); continue; }
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){
          e.hp--; hit=true;
          spawnParticles(b.x,b.y,e.color,6,3);
          if(e.hp<=0){
            S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
            S.score += e.score*(1+S.combo*0.05);
            sfx.explode();
            spawnParticles(e.x,e.y,e.color,20,6);
            enemies.splice(j,1);
          } else sfx.hit();
          break;
        }
      }
      if(!hit && S.bossActive && S.boss){
        const b=S.boss;
        if(dist(bullets[i].x,bullets[i].y,b.x,b.y) < b.r+bullets[i].r){
          b.hp--; hit=true;
          spawnParticles(bullets[i].x,bullets[i].y,'#a855f7',6,3);
          if(b.hp<=0){
            S.score += 2000; S.combo+=5;
            sfx.explode(); sfx.levelup();
            spawnParticles(b.x,b.y,'#a855f7',60,10);
            spawnParticles(b.x,b.y,'#ffd23f',40,8);
            S.flash=0.6;
            S.bossActive=false; S.boss=null;
            S.levelT=0;
          }
        }
      }
      if(hit) bullets.splice(i,1);
    }

    for(let i=ebullets.length-1;i>=0;i--){
      const b=ebullets[i];
      b.x+=b.dx*b.speed*dt; b.y+=b.dy*b.speed*dt;
      if(b.y>H+20||b.x<-20||b.x>W+20){ ebullets.splice(i,1); continue; }
      if(dist(player.x,player.y,b.x,b.y) < player.r+b.r){
        hitPlayer(); ebullets.splice(i,1);
      }
    }

    for(let i=powers.length-1;i>=0;i--){
      const p=powers[i];
      p.y+=p.vy*dt;
      if(p.y>H+20){ powers.splice(i,1); continue; }
      if(dist(player.x,player.y,p.x,p.y) < player.r+p.r){
        sfx.power();
        spawnParticles(p.x,p.y,'#22ff88',16,5);
        if(p.type==='weapon'){ S.weapon=Math.min(4,S.weapon+1); S.weaponT=10; }
        if(p.type==='rapid'){ S.rapidT=6; }
        if(p.type==='life'){ S.lives=Math.min(5,S.lives+1); }
        if(p.type==='bomb'){
          for(const e of enemies){ spawnParticles(e.x,e.y,e.color,15,6); S.score+=e.score; }
          enemies=[]; ebullets=[];
          spawnParticles(player.x,player.y,'#ffd23f',50,10);
          S.shake=20; S.flash=0.5;
        }
        powers.splice(i,1);
      }
    }

    for(let i=trail.length-1;i>=0;i--){
      trail[i].life-=dt*4;
      if(trail[i].life<=0) trail.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay; p.vx*=0.98; p.vy*=0.98;
      if(p.life<=0) particles.splice(i,1);
    }

    for(const s of stars){ s.y+=s.v*dt*60; if(s.y>H){ s.y=-2; s.x=Math.random()*W; } }

    S.shake=Math.max(0,S.shake-dt*30);
    S.flash=Math.max(0,S.flash-dt*2);
  }

  function hitPlayer(){
    S.lives--; sfx.hit(); S.shake=14; S.combo=0; S.flash=0.5;
    spawnParticles(player.x,player.y,'#ff2d95',25,7);
    if(S.lives<=0){ gameOver(); }
  }

  // ---------- Render ----------
  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
    const sc=Math.min(1,e.spawn); ctx.scale(sc,sc);
    ctx.strokeStyle=e.color; ctx.fillStyle=e.color; glow(e.color,12); ctx.lineWidth=2;
    const r=e.r;
    if(e.type==='grunt'){ ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.8,r*0.6); ctx.lineTo(-r*0.8,r*0.6); ctx.closePath(); ctx.fill(); }
    else if(e.type==='speeder'){ ctx.beginPath(); ctx.moveTo(0,r); ctx.lineTo(r*0.7,-r*0.6); ctx.lineTo(-r*0.7,-r*0.6); ctx.closePath(); ctx.fill(); }
    else if(e.type==='tank'){ ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,r*0.5,0,Math.PI*2); ctx.fill(); }
    else if(e.type==='shooter'){ ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke(); ctx.fillRect(-3,-r-4,6,8); }
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#03040c'); g.addColorStop(1,'#0a0d1f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    for(const s of stars){
      const a=0.3+Math.sin(s.tw+S.time*2)*0.3;
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle='#3a4a5f';
      ctx.fillRect(s.x,s.y,s.s,s.s);
    }
    ctx.globalAlpha=1;

    ctx.save();
    if(S.shake>0) ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));

    // engine trail
    for(const t of trail){
      ctx.globalAlpha=t.life*0.4;
      ctx.fillStyle='#00f0ff'; glow('#00f0ff',10);
      ctx.beginPath(); ctx.arc(t.x,t.y,player.r*0.4*t.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    for(const p of powers){
      const col={weapon:'#00f0ff',rapid:'#ffd23f',life:'#22ff88',bomb:'#ff2d95'}[p.type];
      const sc=Math.min(1,p.spawn);
      ctx.save(); ctx.translate(p.x,p.y); ctx.scale(sc,sc);
      ctx.strokeStyle=col; glow(col,18); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,p.r+4,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=col; glow(col,16);
      ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#03040c'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const icon={weapon:'W',rapid:'R',life:'+',bomb:'B'}[p.type];
      ctx.fillText(icon,0,1);
      ctx.restore();
    }

    for(const e of enemies) drawEnemy(e);

    if(S.bossActive && S.boss){
      const b=S.boss;
      const sc=Math.min(1,b.spawn);
      ctx.save(); ctx.translate(b.x,b.y); ctx.scale(sc,sc);
      ctx.strokeStyle='#a855f7'; glow('#a855f7',25); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,b.r*0.6,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#a855f7'; ctx.beginPath(); ctx.arc(0,0,b.r*0.25,0,Math.PI*2); ctx.fill();
      ctx.restore();
      const bw=Math.min(300,W-40);
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(W/2-bw/2,20,bw,10);
      ctx.fillStyle='#a855f7'; glow('#a855f7',10);
      ctx.fillRect(W/2-bw/2,20,bw*(b.hp/b.maxhp),10);
      noGlow();
    }

    for(const b of bullets){
      ctx.fillStyle=b.color; glow(b.color,10);
      ctx.fillRect(b.x-2,b.y-8,4,12);
    }
    for(const b of ebullets){
      ctx.fillStyle=b.color; glow(b.color,10);
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }

    // player ship
    ctx.save(); ctx.translate(player.x,player.y);
    const pg=ctx.createRadialGradient(0,0,2,0,0,player.r);
    pg.addColorStop(0,'#ffffff'); pg.addColorStop(0.4,'#00f0ff'); pg.addColorStop(1,'#0066ff');
    ctx.fillStyle=pg; glow('#00f0ff',22);
    ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; glow('#fff',8);
    ctx.beginPath(); ctx.moveTo(0,-player.r-6); ctx.lineTo(5,-player.r+2); ctx.lineTo(-5,-player.r+2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)'; noGlow();
    ctx.beginPath(); ctx.arc(-player.r*0.3,-player.r*0.3,player.r*0.3,0,Math.PI*2); ctx.fill();
    ctx.restore();

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color; glow(p.color,8);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
    noGlow();

    if(S.flash>0){
      ctx.fillStyle=`rgba(255,255,255,${S.flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }

    document.getElementById('score').textContent=Math.floor(S.score);
    document.getElementById('best').textContent='BEST '+S.best;
    document.getElementById('level').textContent='LEVEL '+S.level;
    document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,S.lives));
    const comboEl=document.getElementById('combo');
    if(S.combo>=2){ comboEl.textContent='COMBO x'+S.combo; }
    else comboEl.textContent='';
    let inds=[];
    if(S.weapon>1) inds.push('🔫 Lv'+S.weapon);
    if(S.rapidT>0) inds.push('⚡ '+S.rapidT.toFixed(1));
    if(inds.length) comboEl.textContent += (comboEl.textContent?'  ':'') + inds.join(' ');
  }

  let last=performance.now();
  function loop(now){
    let dt=(now-last)/1000; last=now;
    if(dt>0.1) dt=0.1;
    if(S.state==='play') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ===== THEME MUSIC: Cosmic Odyssey (100 BPM) =====
  let musicGain=null, musicOn=false, musicTimer=null, musicStep=0;
  const musicBeat=0.6;
  const musicChords=[[130.81,155.56,196,261.63],[207.65,261.63,311.13,415.30],[155.56,196,233.08,311.13],[233.08,293.66,349.23,466.16]];
  const musicBass=[65.41,103.83,77.78,116.54];
  const musicMelody=[261.63,311.13,392,311.13,233.08,196,155.56,196];

  function playNote(freq,time,dur,type,vol,dest){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,time);
    g.gain.setValueAtTime(0,time);
    g.gain.linearRampToValueAtTime(vol,time+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    o.connect(g); g.connect(dest); o.start(time); o.stop(time+dur+0.05);
  }
  function scheduleMusicStep(t,stepIdx){
    const chord=musicChords[stepIdx%4], bass=musicBass[stepIdx%4];
    playNote(bass,t,musicBeat*2,'sine',0.14,musicGain);
    chord.forEach(f=>playNote(f,t,musicBeat*2,'sine',0.05,musicGain));
    playNote(chord[stepIdx%chord.length]*2,t,musicBeat,'triangle',0.06,musicGain);
    playNote(chord[(stepIdx+1)%chord.length]*2,t+musicBeat,musicBeat,'triangle',0.06,musicGain);
    if(stepIdx%2===0) playNote(musicMelody[(stepIdx/2)%musicMelody.length],t,musicBeat*1.8,'sine',0.09,musicGain);
  }
  function startMusic(){
    if(musicOn) return;
    const a=audio(); if(a.state==='suspended') a.resume();
    musicGain=a.createGain(); musicGain.gain.setValueAtTime(0.5,a.currentTime);
    musicGain.connect(a.destination); musicOn=true; musicStep=0;
    const lookahead=0.1; let nextTime=a.currentTime+0.05;
    musicTimer=setInterval(()=>{
      while(nextTime<a.currentTime+lookahead){
        scheduleMusicStep(nextTime,musicStep);
        nextTime+=musicBeat; musicStep++;
      }
    },50);
  }
  function stopMusic(){
    if(!musicOn) return;
    clearInterval(musicTimer); musicTimer=null;
    if(musicGain){ musicGain.gain.setTargetAtTime(0,AC.currentTime,0.1); setTimeout(()=>{if(musicGain)musicGain.disconnect();musicGain=null;},500); }
    musicOn=false;
  }
  function hoverSound(){
    if(!musicOn) return;
    const a=audio(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(600,t);
    o.frequency.exponentialRampToValueAtTime(900,t+0.08);
    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.15);
  }
  function clickSound(){
    const a=audio(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(500,t);
    o.frequency.exponentialRampToValueAtTime(300,t+0.1);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.18);
  }
  const musicBtn=document.getElementById('musicBtn');
  musicBtn.addEventListener('click',()=>{
    if(musicOn){ stopMusic(); musicBtn.textContent='🔇'; musicBtn.classList.add('off'); }
    else { startMusic(); musicBtn.textContent='🔊'; musicBtn.classList.remove('off'); }
  });
  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('mouseenter',hoverSound);
    b.addEventListener('click',clickSound);
  });
  function autoStartMusic(){
    if(!musicOn){ startMusic(); musicBtn.textContent='🔊'; musicBtn.classList.remove('off'); }
    document.removeEventListener('click',autoStartMusic);
    document.removeEventListener('keydown',autoStartMusic);
  }
  document.addEventListener('click',autoStartMusic);
  document.addEventListener('keydown',autoStartMusic);
})();
</script>
